services:
  claude-api:
    build: ./claude-api
    restart: unless-stopped
    group_add:
      - "989"
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Access control — comma-separated Discord user IDs (empty = allow all)
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
      # API keys available to Claude Code when building projects
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VIDEO_GEN_API_KEY=${VIDEO_GEN_API_KEY:-}
      - VIDEO_GEN_PROVIDER=${VIDEO_GEN_PROVIDER:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      # Google OAuth for multi-user calendar coordination
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Spotify OAuth for collaborative playlists
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:3400/auth/spotify/callback}
    volumes:
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.claude.json:/home/node/.claude.json
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
      - ${HOME}/.ssh:/home/node/.ssh:ro
      - ${HOME}/.config/gh:/home/node/.config/gh:ro
      - /mnt/c/Users/karen/Desktop/Github Projects:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3400/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    driver: bridge
