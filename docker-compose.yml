services:
  claude-api:
    build:
      context: ./claude-api
      args:
        # To bump Claude Code CLI version: update this value and `docker compose up -d --build`.
        # Check https://www.npmjs.com/package/@anthropic-ai/claude-code for latest stable.
        CLAUDE_CODE_VERSION: "latest"
    platform: linux/amd64
    restart: unless-stopped
    labels:
      # Watched by the `autoheal` sidecar — when this container's healthcheck
      # reports `unhealthy` (process alive but /health failing), autoheal
      # docker-restarts it. `restart: unless-stopped` only covers crashes.
      - autoheal=true
    cap_add:
      - SYS_ADMIN
    group_add:
      - "989"
    environment:
      # Shared secret for internal API auth. Required for /ask, /imagine,
      # /remind, /rebuild, /active-sessions, and (via ?token= query) the
      # /signal/webhook receiver. Consumed by bot.js internal callers, the
      # signal-api sidecar webhook forwarder, and any future internal services.
      # MUST be set to a long random value in .env — if unset, all authenticated
      # routes fail with HTTP 503 (we refuse to fail open).
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      # Bot-level 2FA PIN. When set, every channel starts LOCKED — the user must
      # send `!unlock <PIN>` before the bot responds. Protects against compromised
      # Discord accounts or Signal phone numbers. If unset, the gate is disabled.
      - BOT_UNLOCK_PIN=${BOT_UNLOCK_PIN:-}
      # Voice endpoint hardening. Voice requests now require BOTH the bot PIN and
      # a separate transport token (X-Voice-Token or Authorization: Bearer ...).
      # Leave VOICE_ENABLED=false if you do not use the Siri/Shortcut entrypoint.
      - VOICE_ENABLED=${VOICE_ENABLED:-true}
      - VOICE_AUTH_TOKEN=${VOICE_AUTH_TOKEN:-}
      - VOICE_RATE_LIMIT_MAX=${VOICE_RATE_LIMIT_MAX:-20}
      # Debug upload UI is disabled by default and should stay off outside
      # tightly controlled debugging sessions.
      - DEBUG_UPLOAD_ENABLED=${DEBUG_UPLOAD_ENABLED:-false}
      - DEBUG_UPLOAD_MAX_BYTES=${DEBUG_UPLOAD_MAX_BYTES:-5242880}
      # Access control — comma-separated IDs/numbers (empty = DENY ALL after the
      # 2026-04-11 fail-closed flip). SIGNAL_OWNER_NUMBER always bypasses the
      # Signal allowlist so the owner can never lock themselves out.
      - SIGNAL_OWNER_NUMBER=${SIGNAL_OWNER_NUMBER:-}
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
      # ANTHROPIC_API_KEY removed — all users authenticate via owner's OAuth
      # (~/.claude.json), shared to all homes at container startup. This
      # ensures a single auth source and avoids "credit balance too low".
      # API keys available to Claude Code when building projects
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VIDEO_GEN_API_KEY=${VIDEO_GEN_API_KEY:-}
      - VIDEO_GEN_PROVIDER=${VIDEO_GEN_PROVIDER:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      # AES-256-GCM key (HKDF-derived) for encrypting OAuth tokens at rest in
      # /app/data/user-tokens.json and /app/data/spotify-tokens.json. If unset,
      # tokens are stored in plaintext (dev fallback) and the modules warn.
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      # Public URL for OAuth callbacks and user-facing links
      - BOT_PUBLIC_URL=${BOT_PUBLIC_URL:-https://mybot.backtoirl.com}
      # Google OAuth for multi-user calendar coordination
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://mybot.backtoirl.com/auth/google/callback}
      # Spotify OAuth for collaborative playlists
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-https://mybot.backtoirl.com/auth/spotify/callback}
      # Session limits (configurable)
      - DEFAULT_MAX_TURNS=${DEFAULT_MAX_TURNS:-50}
      - MAX_AUTO_CONTINUES=${MAX_AUTO_CONTINUES:-3}
      - MAX_TIMEOUT_MINUTES=${MAX_TIMEOUT_MINUTES:-90}
      # Owner DM mode: when true, owner gets full autonomous engineering access
      # (Edit, Write, Bash, etc.). Set to false to restrict to read-only tools.
      - OWNER_FULL_ACCESS=${OWNER_FULL_ACCESS:-true}
      # Signal adapter (optional — set SIGNAL_PHONE_NUMBER to enable)
      - ENABLED_PLATFORMS=${ENABLED_PLATFORMS:-signal}
      - SIGNAL_API_URL=${SIGNAL_API_URL:-http://signal-api:8080}
      - SIGNAL_PHONE_NUMBER=${SIGNAL_PHONE_NUMBER:-}
      - SIGNAL_POLL_INTERVAL=${SIGNAL_POLL_INTERVAL:-5000}
      - SIGNAL_ALLOWED_NUMBERS=${SIGNAL_ALLOWED_NUMBERS:-}
      # When signal-api runs in MODE=json-rpc, it cannot serve /v1/receive/.
      # Inbound messages arrive at /signal/webhook in this container. Set to "true"
      # to disable the polling loop in the signal adapter.
      - SIGNAL_USE_WEBHOOK=${SIGNAL_USE_WEBHOOK:-true}
      # Absolute host path to the MyBot project root. Used by /rebuild when
      # spawning the host-side `mybot-rebuilder-*` container so that bind
      # mounts resolve correctly on the host filesystem (not the calling
      # container's). Override per environment.
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH:-/mnt/c/Users/karen/Desktop/Github Projects/MyBot}
      # Absolute host path to the operator's HOME. Used by /rebuild to pass
      # through to the host-side rebuilder so that `${HOST_HOME}/.claude*`
      # bind mounts resolve correctly. Without this, the rebuilder runs as
      # root with HOME=/root, and ${HOME} substitution would silently break
      # the .claude / .claude.json / .gitconfig mounts. See the volumes
      # block below for the full incident note.
      - HOST_HOME=${HOST_HOME:-/home/karen}
      # GitHub auth for `gh` CLI. Replaces the old ${HOME}/.config/gh bind mount
      # (removed 2026-04-11 for security). The `gh` CLI natively picks up
      # GH_TOKEN from the environment. Set this in .env to a personal access
      # token with minimum scopes the bot needs (repo, workflow — NOT admin).
      - GH_TOKEN=${GH_TOKEN:-}
      # Concert ticket scraper plugin (optional — only used when concert-scraper profile is active)
      - TICKETMASTER_API_KEY=${TICKETMASTER_API_KEY:-}
      # SerpApi key for Google Flights price tracking (free tier: 250 searches/month)
      - SERPAPI_KEY=${SERPAPI_KEY:-}
      # SDK runner toggle — set to "true" to use @anthropic-ai/claude-agent-sdk
      # instead of raw CLI spawn. Opt-in while SDK integration stabilizes.
      - USE_SDK_RUNNER=${USE_SDK_RUNNER:-false}
    # SSH key and gh config mounts were removed 2026-04-11 after a security
    # review found prompt-injection could exfiltrate them via Claude's Read
    # tool + --dangerously-skip-permissions. `gh` CLI now authenticates via
    # GH_TOKEN (set in .env). See NextStep.md finding H3.
    #
    ports:
      - "127.0.0.1:${CLAUDE_API_PORT:-3400}:3400"
    # CRITICAL: these MUST use HOST_HOME (an absolute host path), NOT ${HOME}.
    # The /rebuild flow spawns a host-side `docker:27-cli` container where
    # HOME=/root, so any ${HOME} interpolation at compose-up time would
    # resolve to /root and Docker would silently CREATE EMPTY MOUNT POINTS at
    # /root/.claude/ etc. That broke the bot end-to-end on 2026-04-11 —
    # Claude CLI couldn't read its credentials and exited at 0 turns.
    # Override HOST_HOME in your env if your home directory is different.
    volumes:
      - ${HOST_HOME:-/home/karen}/.claude:/home/node/.claude
      - ${HOST_HOME:-/home/karen}/.claude.json:/home/node/.claude.json
      - ${HOST_HOME:-/home/karen}/.gitconfig:/home/node/.gitconfig:ro
      - /mnt/c/Users/karen/Desktop/Github Projects:/workspace
      - /mnt/c/Users/karen/Desktop:/host/Desktop:ro
      - /mnt/c/Users/karen/Downloads:/host/Downloads:ro
      - sandbox-data:/sandbox
      - /var/run/docker.sock:/var/run/docker.sock
      - bot-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3400/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Signal messenger sidecar — REST API for signal-cli
  # Enable by setting SIGNAL_PHONE_NUMBER in .env and running registration:
  #   docker compose exec signal-api curl -X POST 'http://localhost:8080/v1/register/+1YOURNUMBER'
  #   docker compose exec signal-api curl -X POST 'http://localhost:8080/v1/register/+1YOURNUMBER/verify/CODE'
  signal-api:
    # Pinned 2026-04-11 to 0.98 to avoid silent supply-chain drift on rebuild.
    # To bump: check https://hub.docker.com/r/bbernhard/signal-cli-rest-api/tags
    # for the latest stable, update the tag, and `docker compose up -d --build signal-api`.
    image: bbernhard/signal-cli-rest-api:0.98
    restart: unless-stopped
    # No autoheal label — signal-api's JVM takes 30-60s to start, and autoheal
    # restarts trigger a stale /etc/group.lock crash loop. restart:unless-stopped
    # handles actual crashes; the signal-watchdog in claude-api handles liveness.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/about > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      # MODE=json-rpc runs signal-cli as a persistent daemon (one JVM, started once).
      # Per-call latency drops from seconds to milliseconds vs MODE=normal.
      # /v1/receive/ is NOT supported in this mode — inbound MUST arrive via webhook.
      - MODE=json-rpc
      # Push every incoming envelope to the bot's webhook receiver. Only honored
      # when MODE=json-rpc (verified in bbernhard src/main.go:159-161).
      # The ?token= query param is the shared secret gate — the claude-api
      # server rejects any webhook delivery whose token does not match
      # INTERNAL_API_TOKEN. Without this gate, envelope.sourceNumber is
      # trivially forgeable by any sibling on the docker bridge.
      - RECEIVE_WEBHOOK_URL=http://claude-api:3400/signal/webhook?token=${INTERNAL_API_TOKEN:-}
      - LOG_LEVEL=info
    volumes:
      - signal-data:/home/.local/share/signal-cli
    # No depends_on — both containers come up independently and the signal
    # adapter retries with backoff if signal-api isn't ready yet. Webhook
    # deliveries from signal-api that happen during the brief window before
    # claude-api is up may be lost; signal-api typically retries on failure.
    profiles:
      - signal  # Only starts when: docker compose --profile signal up -d

  # Concert ticket scraper — Playwright-based Python service that scrapes
  # StubHub, VividSeats, TickPick, SeatGeek, and optionally Ticketmaster.
  # Starts automatically with the rest of MyBot.
  concert-scraper:
    build: ./concert-scraper
    container_name: mybot-concert-scraper
    restart: unless-stopped
    expose:
      - "5000"
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Autoheal — watches every container with `autoheal=true` label and
  # docker-restarts it when its healthcheck reports `unhealthy`. Closes the
  # gap that `restart: unless-stopped` only fires on actual process crashes,
  # not on hung-but-alive states (e.g. event loop stuck, deadlocked Signal
  # daemon). Pinned to a specific tag to avoid silent supply-chain drift.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - DOCKER_SOCK=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  signal-data:
  bot-data:
  sandbox-data:

networks:
  default:
    driver: bridge
