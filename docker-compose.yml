services:
  claude-api:
    build: ./claude-api
    restart: unless-stopped
    group_add:
      - "989"
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Access control — comma-separated Discord user IDs (empty = allow all)
      - ALLOWED_USER_IDS=${ALLOWED_USER_IDS:-}
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
      # API keys available to Claude Code when building projects
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VIDEO_GEN_API_KEY=${VIDEO_GEN_API_KEY:-}
      - VIDEO_GEN_PROVIDER=${VIDEO_GEN_PROVIDER:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      # AES-256-GCM key (HKDF-derived) for encrypting OAuth tokens at rest in
      # /app/data/user-tokens.json and /app/data/spotify-tokens.json. If unset,
      # tokens are stored in plaintext (dev fallback) and the modules warn.
      - TOKEN_ENCRYPTION_KEY=${TOKEN_ENCRYPTION_KEY:-}
      # Google OAuth for multi-user calendar coordination
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Spotify OAuth for collaborative playlists
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:3400/auth/spotify/callback}
      # Session limits (configurable)
      - DEFAULT_MAX_TURNS=${DEFAULT_MAX_TURNS:-50}
      - MAX_AUTO_CONTINUES=${MAX_AUTO_CONTINUES:-3}
      - MAX_TIMEOUT_MINUTES=${MAX_TIMEOUT_MINUTES:-90}
      # Signal adapter (optional — set SIGNAL_PHONE_NUMBER to enable)
      - ENABLED_PLATFORMS=${ENABLED_PLATFORMS:-discord}
      - SIGNAL_API_URL=${SIGNAL_API_URL:-http://signal-api:8080}
      - SIGNAL_PHONE_NUMBER=${SIGNAL_PHONE_NUMBER:-}
      - SIGNAL_POLL_INTERVAL=${SIGNAL_POLL_INTERVAL:-5000}
      - SIGNAL_ALLOWED_NUMBERS=${SIGNAL_ALLOWED_NUMBERS:-}
      # When signal-api runs in MODE=json-rpc, it cannot serve /v1/receive/.
      # Inbound messages arrive at /signal/webhook in this container. Set to "true"
      # to disable the polling loop in the signal adapter.
      - SIGNAL_USE_WEBHOOK=${SIGNAL_USE_WEBHOOK:-true}
      # Absolute host path to the MyBot project root. Used by /rebuild when
      # spawning the host-side `mybot-rebuilder-*` container so that bind
      # mounts resolve correctly on the host filesystem (not the calling
      # container's). Override per environment.
      - HOST_PROJECT_PATH=${HOST_PROJECT_PATH:-/mnt/c/Users/karen/Desktop/Github Projects/MyBot}
    volumes:
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.claude.json:/home/node/.claude.json
      - ${HOME}/.gitconfig:/home/node/.gitconfig:ro
      - ${HOME}/.ssh:/home/node/.ssh:ro
      - ${HOME}/.config/gh:/home/node/.config/gh:ro
      - /mnt/c/Users/karen/Desktop/Github Projects:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3400/health', r => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Signal messenger sidecar — REST API for signal-cli
  # Enable by setting SIGNAL_PHONE_NUMBER in .env and running registration
  # Registration: docker compose exec signal-api curl -X POST 'http://localhost:8080/v1/register/+1YOURNUMBER'
  # Verify: docker compose exec signal-api curl -X POST 'http://localhost:8080/v1/register/+1YOURNUMBER/verify/CODE'
  signal-api:
    image: bbernhard/signal-cli-rest-api:latest
    restart: unless-stopped
    environment:
      # MODE=json-rpc runs signal-cli as a persistent daemon (one JVM, started once).
      # Per-call latency drops from seconds to milliseconds vs MODE=normal.
      # /v1/receive/ is NOT supported in this mode — inbound MUST arrive via webhook.
      - MODE=json-rpc
      # Push every incoming envelope to the bot's webhook receiver. Only honored
      # when MODE=json-rpc (verified in bbernhard src/main.go:159-161).
      - RECEIVE_WEBHOOK_URL=http://claude-api:3400/signal/webhook
      - LOG_LEVEL=info
    volumes:
      - signal-data:/home/.local/share/signal-cli
    # No depends_on — both containers come up independently and the signal
    # adapter retries with backoff if signal-api isn't ready yet. Webhook
    # deliveries from signal-api that happen during the brief window before
    # claude-api is up may be lost; signal-api typically retries on failure.
    profiles:
      - signal  # Only starts when: docker compose --profile signal up -d

volumes:
  signal-data:

networks:
  default:
    driver: bridge
